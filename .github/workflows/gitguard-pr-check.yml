name: 🛡️ GitGuard PR Gatekeeper

on:
  pull_request:
    # 'edited' allows the check to re-run if you change the PR title on GitHub
    types: [opened, synchronize, reopened, edited]

jobs:
  validate-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install GitGuard Dependencies
        run: |
          pip install fastapi uvicorn textblob pydantic
          python -m textblob.download_corpora

      - name: Start GitGuard AI Engine in Background
        run: |
          # Start the brain on the GitHub runner
          python -m uvicorn engine:app --host 127.0.0.1 --port 8000 &
          sleep 5 # Give the server a moment to initialize

      - name: Validate PR Title via GitGuard
        run: |
          # Capture the PR title (This avoids the 'Merge' message bug)
          PR_TITLE="${{ github.event.pull_request.title }}"

          echo "Testing PR Title: $PR_TITLE"

          # Send the title to the local engine
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "http://127.0.0.1:8000/validate" \
            -H "Content-Type: application/json" \
            -d "{\"message\": \"$PR_TITLE\", \"files\": []}")
            
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error title=GitGuard Validation Failed::$BODY"
            exit 1
          else
            echo "✅ GitGuard Validation Passed!"
            exit 0
          fi
