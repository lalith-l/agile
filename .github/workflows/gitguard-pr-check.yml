name: 🛡️ GitGuard PR Gatekeeper

# Trigger this action only when a Pull Request is opened or updated
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # We need the full git history to read the commits

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install GitGuard Dependencies
        run: |
          pip install fastapi uvicorn textblob pydantic
          python -m textblob.download_corpora

      - name: Start GitGuard AI Engine in Background
        run: |
          python -m uvicorn engine:app --host 127.0.0.1 --port 8000 &
          sleep 3 # Give the server a few seconds to boot up

      - name: Validate PR Commits
        run: |
          # Get the commit message of the latest commit in the PR
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")

          echo "Testing Commit: $COMMIT_MSG"

          # Send it to the local GitGuard Engine
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "http://127.0.0.1:8000/validate" \
            -H "Content-Type: application/json" \
            -d "{\"message\": \"$COMMIT_MSG\", \"files\": []}")
            
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error title=GitGuard Validation Failed::The commit message did not pass quality checks."
            echo "Details: $BODY"
            exit 1 # This explicitly BLOCKS the Pull Request from being merged
          else
            echo "✅ GitGuard Validation Passed!"
            exit 0 # This gives the PR the Green Checkmark
          fi
